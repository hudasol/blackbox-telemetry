# Two-command reproducibility. docs/PLAN.md's own problem framing says
# the simulator is "separate test equipment, not part of the product" —
# this file now actually enforces that split, not just states it:
#
#   docker compose up --build
#
# brings up the real system only — postgres, redis, api (ingest + query),
# worker — wired together on one network, with no manual setup step
# (schema is bootstrapped by the worker at startup; see worker/db.py).
# The simulator is gated behind a compose profile, so this command alone
# never starts synthetic traffic.
#
#   docker compose --profile simulator up --build -d simulator
#
# starts the simulated fleet against that already-running system.
#
# api is reachable at http://localhost:8000 (see docs/PLAN.md for the
# endpoint list). Copy .env.example to .env to override the simulator's
# fault rates, the offline timeout, etc. — see that file for what's
# tunable and why.
#
# Postgres credentials (POSTGRES_USER/POSTGRES_PASSWORD/POSTGRES_DB) are
# one override point each, via .env — every place below that needs one
# reads the same ${VAR:-default}, rather than each spelling out its own
# copy of the literal value. Changing a credential used to mean editing
# three separate hardcoded strings (the postgres service's own env, and
# each of api's/worker's POSTGRES_DSN) with nothing tying them together
# — missing one didn't fail until whichever service still had the old
# value tried to authenticate at runtime, not when `docker compose
# config` or `up` parsed this file. One override point removes the
# "missed one of three" failure mode entirely: there's only one place
# each credential is ever written, so there's nothing left to miss.

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-blackbox}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-blackbox}
      POSTGRES_DB: ${POSTGRES_DB:-blackbox}
    # Host port shifted to 5433 — 5432 is commonly already taken by a
    # local Postgres install (it was, in this sandbox). Services inside
    # compose always reach this one at postgres:5432 regardless.
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-blackbox} -d ${POSTGRES_DB:-blackbox}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: services/api/Dockerfile
    environment:
      REDIS_URL: redis://redis:6379/0
      POSTGRES_DSN: postgresql://${POSTGRES_USER:-blackbox}:${POSTGRES_PASSWORD:-blackbox}@postgres:5432/${POSTGRES_DB:-blackbox}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      ASSET_OFFLINE_TIMEOUT_SECONDS: ${ASSET_OFFLINE_TIMEOUT_SECONDS:-10}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:8000/health/ready', timeout=2)"]
      interval: 5s
      timeout: 3s
      start_period: 10s
      retries: 10
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: services/worker/Dockerfile
    environment:
      REDIS_URL: redis://redis:6379/0
      POSTGRES_DSN: postgresql://${POSTGRES_USER:-blackbox}:${POSTGRES_PASSWORD:-blackbox}@postgres:5432/${POSTGRES_DB:-blackbox}
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      # Left unset on purpose: defaults to the container's own hostname
      # (worker/config.py) — fine for D5's "one active worker for now",
      # and avoids every replica racing to claim the same fixed name if
      # this is ever scaled with `--scale worker=N`.
    ports:
      # Prometheus text exposition (docs/IMPROVEMENTS.md, "real
      # observability") — a separate port from api's /metrics because
      # this process has no HTTP framework of its own to add a route to.
      - "9100:9100"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  simulator:
    # Gated behind a profile: services without a `profiles:` key are
    # always part of a plain `docker compose up`, but a profiled service
    # is excluded from every command (up, build, down, ...) unless that
    # profile is explicitly activated with --profile. This is what makes
    # "bring up the system" and "start the simulators" two real, separate
    # commands instead of one command doing both.
    profiles: ["simulator"]
    build:
      context: .
      dockerfile: services/simulator/Dockerfile
    environment:
      SIM_API_BASE_URL: http://api:8000
      LOG_LEVEL: ${LOG_LEVEL:-INFO}
      SIM_TICK_INTERVAL_SECONDS: ${SIM_TICK_INTERVAL_SECONDS:-1.0}
      SIM_SEED: ${SIM_SEED:-}
      # Non-zero by default (unlike the simulator's own bare defaults,
      # which are all off) so `docker compose up` demonstrates every
      # documented failure path — duplicates, reordering, rejected
      # payloads, a silent asset — without any extra configuration.
      # Override via .env (see .env.example) to run a clean fleet.
      SIM_DUPLICATE_RATE: ${SIM_DUPLICATE_RATE:-0.1}
      SIM_OUT_OF_ORDER_RATE: ${SIM_OUT_OF_ORDER_RATE:-0.1}
      SIM_BAD_DATA_RATE: ${SIM_BAD_DATA_RATE:-0.1}
      SIM_SILENCE_RATE: ${SIM_SILENCE_RATE:-0.05}
      SIM_FORCE_SILENT_ASSET_IDS: ${SIM_FORCE_SILENT_ASSET_IDS:-}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
