name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # Same real Postgres/Redis the test suite runs against locally, not
    # mocks (docs/PROCESS_LOG.md) — service containers here, so nothing
    # about the failure-case tests changes between a laptop and CI.
    # Ports/credentials match tests/integration/conftest.py's own
    # defaults exactly, so no env overrides are needed below.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: blackbox
          POSTGRES_PASSWORD: blackbox
          POSTGRES_DB: blackbox_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U blackbox -d blackbox_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 16379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            libs/telemetry_contract/pyproject.toml
            services/api/pyproject.toml
            services/worker/pyproject.toml
            services/simulator/pyproject.toml

      # Same workspace-local install pattern as local dev and the
      # Dockerfiles: the shared contract first, then each service with
      # its [dev] extra (pytest, pytest-asyncio, httpx) for the test
      # tooling on top of its runtime deps.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e libs/telemetry_contract
          pip install -e "services/api[dev]"
          pip install -e "services/worker[dev]"
          pip install -e "services/simulator[dev]"

      - name: Run tests
        run: pytest tests/ -v
        env:
          POSTGRES_TEST_DSN: postgresql://blackbox:blackbox@localhost:5432/blackbox_test
          REDIS_TEST_URL: redis://localhost:16379/0

  # Cheap, fast sanity check for the Docker Compose step (docs/PLAN.md's
  # "one-command reproducibility") — catches a broken compose file (bad
  # YAML, an undefined ${VAR}, a missing build context) on every push
  # without the cost of actually building five images. ubuntu-latest
  # ships Docker + Compose v2 preinstalled, so this needs no setup step.
  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker compose config --quiet

  # The real "does docker compose up --build actually work, today" proof.
  # docs/PROCESS_LOG.md's Docker Compose and README entries both note
  # that this sandbox's network can only prove a full image rebuild once,
  # manually, with a workaround — so that proof goes stale the moment
  # anything (a dependency release, a base image update, a Dockerfile
  # edit) changes what actually gets built. This job re-proves it fresh
  # on every single push instead, on a runner with a normal network (no
  # proxy workaround needed here). It's not re-testing failure-recovery
  # logic — that's already covered thoroughly by the `test` job and by
  # the live demos recorded in PROCESS_LOG.md — just that the packaging
  # itself builds, starts in the right order, and produces real traffic
  # end to end, exactly like a person running this for the first time
  # would see.
  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build and start the full stack
        run: docker compose up -d --build

      - name: Wait for the api to report ready
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health/ready > /dev/null; then
              echo "api is ready"
              exit 0
            fi
            sleep 2
          done
          echo "api never became ready within 60s"
          docker compose logs
          exit 1

      - name: Confirm the simulator's traffic actually reached Postgres
        run: |
          sleep 8
          curl -sf http://localhost:8000/api/v1/assets -o /tmp/assets.json
          cat /tmp/assets.json
          python3 -c "
          import json
          assets = json.load(open('/tmp/assets.json'))['assets']
          assert len(assets) > 0, 'no assets reported - simulator traffic never reached postgres'
          print(f'OK: {len(assets)} asset(s) reporting')
          "

      - name: Compose logs (always, for debugging a failure)
        if: always()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v
