name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    # Same real Postgres/Redis the test suite runs against locally, not
    # mocks (docs/PROCESS_LOG.md) — service containers here, so nothing
    # about the failure-case tests changes between a laptop and CI.
    # Ports/credentials match tests/integration/conftest.py's own
    # defaults exactly, so no env overrides are needed below.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: blackbox
          POSTGRES_PASSWORD: blackbox
          POSTGRES_DB: blackbox_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U blackbox -d blackbox_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports:
          - 16379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            libs/telemetry_contract/pyproject.toml
            services/api/pyproject.toml
            services/worker/pyproject.toml
            services/simulator/pyproject.toml

      # Same workspace-local install pattern as local dev and the
      # Dockerfiles: the shared contract first, then each service with
      # its [dev] extra (pytest, pytest-asyncio, httpx) for the test
      # tooling on top of its runtime deps.
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e libs/telemetry_contract
          pip install -e "services/api[dev]"
          pip install -e "services/worker[dev]"
          pip install -e "services/simulator[dev]"

      - name: Run tests
        run: pytest tests/ -v
        env:
          POSTGRES_TEST_DSN: postgresql://blackbox:blackbox@localhost:5432/blackbox_test
          REDIS_TEST_URL: redis://localhost:16379/0

  # Cheap, fast sanity check for the Docker Compose step (docs/PLAN.md's
  # "one-command reproducibility") — catches a broken compose file (bad
  # YAML, an undefined ${VAR}, a missing build context) on every push
  # without the cost of actually building five images. ubuntu-latest
  # ships Docker + Compose v2 preinstalled, so this needs no setup step.
  compose-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: docker compose config --quiet

  # The real "does docker compose up --build actually work, today" proof.
  # docs/PROCESS_LOG.md's Docker Compose and README entries both note
  # that this sandbox's network can only prove a full image rebuild once,
  # manually, with a workaround — so that proof goes stale the moment
  # anything (a dependency release, a base image update, a Dockerfile
  # edit) changes what actually gets built. This job re-proves it fresh
  # on every single push instead, on a runner with a normal network (no
  # proxy workaround needed here). It's not re-testing failure-recovery
  # logic — that's already covered thoroughly by the `test` job and by
  # the live demos recorded in PROCESS_LOG.md — just that the packaging
  # itself builds, starts in the right order, and produces real traffic
  # end to end, exactly like a person running this for the first time
  # would see.
  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # Two real commands now, matching README.md exactly: the simulator
      # sits behind a compose profile (docker-compose.yml) so bringing up
      # the actual system never implies bringing up synthetic traffic too.
      # This job proves both steps, not just the bundled old one.
      - name: Build and start the real system (no simulator yet)
        run: docker compose up -d --build

      - name: Wait for the api to report ready
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health/ready > /dev/null; then
              echo "api is ready"
              exit 0
            fi
            sleep 2
          done
          echo "api never became ready within 60s"
          docker compose logs
          exit 1

      - name: Confirm the system reports zero assets before the simulator starts
        run: |
          curl -sf http://localhost:8000/api/v1/assets -o /tmp/assets_before.json
          cat /tmp/assets_before.json
          python3 -c "
          import json
          assets = json.load(open('/tmp/assets_before.json'))['assets']
          assert assets == [], f'expected no assets before the simulator starts, got {assets}'
          print('OK: no synthetic traffic before the simulator is started')
          "

      - name: Start the simulated fleet (second, separate command)
        run: docker compose --profile simulator up -d --build simulator

      - name: Confirm the simulator's traffic actually reached Postgres
        run: |
          sleep 8
          curl -sf http://localhost:8000/api/v1/assets -o /tmp/assets_after.json
          cat /tmp/assets_after.json
          python3 -c "
          import json
          assets = json.load(open('/tmp/assets_after.json'))['assets']
          assert len(assets) > 0, 'no assets reported - simulator traffic never reached postgres'
          print(f'OK: {len(assets)} asset(s) reporting')
          "

      - name: Compose logs (always, for debugging a failure)
        if: always()
        run: docker compose --profile simulator logs

      - name: Tear down
        if: always()
        run: docker compose --profile simulator down -v

  # The one real crash-recovery proof: scripts/fault_injection_demo.sh
  # SIGKILLs the real postgres container mid-traffic and checks — against
  # real HTTP responses and a real row count, not a mock — that every
  # event sent during the outage is still there once postgres comes back
  # (docs/PLAN.md §4's "Postgres unavailable -> message waits, never
  # dropped" claim, actually exercised). Until now only pytest's mocked
  # recovery tests (worker/processing.py's ConnectionError-injection
  # cases in the `test` job above) ran automatically — a real regression
  # in crash-recovery timing (e.g. a change to XAUTOCLAIM's idle
  # threshold, or to the retry backoff) could ship without this script
  # ever running anywhere but a developer's own machine. Separate job
  # from docker-smoke above so a fault-injection failure is never masked
  # by, or blamed on, that job's own unrelated checks.
  fault-injection:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build and start the real system
        run: docker compose up -d --build

      - name: Wait for the api to report ready
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:8000/health/ready > /dev/null; then
              echo "api is ready"
              exit 0
            fi
            sleep 2
          done
          echo "api never became ready within 60s"
          docker compose logs
          exit 1

      # The script itself does the actual proof: baseline traffic, SIGKILL
      # postgres, more traffic during the outage (asserting ingest stays
      # up on 202s — D4: ingest only depends on Redis), restart postgres,
      # then confirm the exact expected count landed with none lost and
      # none duplicated. Exits non-zero on any failed check, which fails
      # this step.
      - name: Run the real Postgres crash-recovery proof
        run: ./scripts/fault_injection_demo.sh

      - name: Compose logs (always, for debugging a failure)
        if: always()
        run: docker compose logs

      - name: Tear down
        if: always()
        run: docker compose down -v
