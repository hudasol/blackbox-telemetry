[project]
name = "blackbox-worker"
version = "0.1.0"
description = "Redis-to-Postgres worker for the blackbox telemetry backend"
requires-python = ">=3.12"
dependencies = [
    "redis>=5.0",
    "asyncpg>=0.29",
    "prometheus-client>=0.20",
]
# telemetry-contract (../../libs/telemetry_contract) is a workspace-local
# package, installed separately rather than declared here — see
# services/api/pyproject.toml for why.

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["worker*"]
